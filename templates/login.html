<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — UpClip Studio</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="auth-body">
    <div class="auth-shell">
        <div class="auth-card">
            <div class="auth-logo">
                <a href="/" style="text-decoration:none;color:inherit;">
                    <div class="brand-icon">🎬</div>
                </a>
            </div>
            <h1 class="auth-title">Welcome back</h1>
            <p class="auth-sub">Sign in to your UpClip Studio account</p>

            <div id="authError" class="auth-error" hidden></div>

            <form id="loginForm" class="auth-form" autocomplete="off">
                <div class="auth-field">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Your username" required>
                </div>
                <div class="auth-field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Your password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
                    <span class="spinner" hidden></span> <span id="submitText">Sign In</span>
                </button>
            </form>

            <p class="auth-alt">Don't have an account? <a href="{{ url_for('auth.register') }}">Create one</a></p>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const errorBox = document.getElementById('authError');
        const btn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.hidden = true;
            btn.disabled = true;
            btn.querySelector('.spinner').hidden = false;
            document.getElementById('submitText').textContent = 'Signing you in…';

            const body = {
                username: document.getElementById('username').value.trim(),
                password: document.getElementById('password').value,
            };

            try {
                const res = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                });
                const data = await res.json();
                if (data.success) {
                    window.location.href = '/dashboard';
                } else {
                    errorBox.textContent = data.error || 'Login failed';
                    errorBox.hidden = false;
                    document.getElementById('submitText').textContent = 'Sign In';
                    btn.disabled = false;
                    btn.querySelector('.spinner').hidden = true;
                }
            } catch (err) {
                errorBox.textContent = 'Network error: ' + err.message;
                errorBox.hidden = false;
                document.getElementById('submitText').textContent = 'Sign In';
                btn.disabled = false;
                btn.querySelector('.spinner').hidden = true;
            }
        });
    </script>
</body>
</html>
